<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

const PIXEL_ID = '1420640643573189';

fbq('init', PIXEL_ID);

function newEventId() {
  return crypto.randomUUID();
}

function cookieValue(name) {
  const m = document.cookie.match(
    new RegExp('(?:^|; )' + name + '=([^;]*)')
  );
  return m ? decodeURIComponent(m[1]) : '';
}

function sendCAPI(name, id) {
  return fetch('/api/meta-capi', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    keepalive: true,
    body: JSON.stringify({
      event_name: name,
      event_id: id,
      event_source_url: location.href,
      fbp: cookieValue('_fbp'),
      fbc: cookieValue('_fbc')
    })
  }).catch(console.error);
}

// PAGE VIEW
const pageId = newEventId();
fbq('track', 'PageView', {}, {eventID: pageId});
sendCAPI('PageView', pageId);

// TELEGRAM CONTACT BUTTONS
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.cta').forEach(button => {
    button.addEventListener('click', () => {
      const id = newEventId();
      fbq('track', 'Contact', {}, {eventID: id});
      sendCAPI('Contact', id);
    });
  });
});
</script>
